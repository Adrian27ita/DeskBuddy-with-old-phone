<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- viewport: impedisce lo zoom col doppio tap e adatta la larghezza allo schermo del telefono -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Buddy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- #app: contenitore principale, centra tutto verticalmente/orizzontalmente (vedi CSS: display flex, column) -->
<div id="app">

  <!-- #buddy-wrap: contiene il viso in pixel art, disegnato dal JS su un <canvas>.
       La classe "state-..." viene aggiornata dal JS (idle / happy / dizzy / sleepy / alarm) -->
  <div id="buddy-wrap" class="state-idle">
    <canvas id="face"></canvas>
  </div>

  <!-- contenitore vuoto dove il JS crea/distrugge i cuoricini quando viene accarezzato -->
  <div id="hearts"></div>

  <!-- orologio, aggiornato ogni 15 secondi dal JS -->
  <div id="clock">--:--</div>

  <!-- pulsante nascosto di default: compare solo su iPhone (iOS 13+), perche' li'
       il permesso per leggere l'accelerometro va chiesto con un tap esplicito dell'utente -->
  <button id="enable-motion">Attiva sensori di movimento</button>


  <!-- =========================================================
       SVEGLIA
       ========================================================= -->

  <!-- elemento audio invisibile: il JS gli cambia "src" e lo fa partire quando scatta una sveglia -->
  <audio id="alarm-audio" preload="none"></audio>

  <!-- pulsante che compare SOLO mentre la sveglia sta suonando -->
  <button id="stop-alarm">Ferma</button>

  <!-- icona ingranaggio in un angolo, apre/chiude il pannello impostazioni sveglie -->
  <!-- icona sveglia disegnata in SVG (non e' un carattere di testo): cosi' si vede anche
       sui browser vecchi, che spesso non hanno nei loro font simboli come ⚙ -->
  <button id="settings-btn" aria-label="Impostazioni sveglie">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="7"/>   <!-- quadrante -->
      <path d="M12 9v4l2.5 2"/>         <!-- lancette -->
      <path d="M4 5l3-2M20 5l-3-2"/>    <!-- campanelle -->
      <path d="M6 19l-1.5 2M18 19l1.5 2"/> <!-- piedini -->
    </svg>
  </button>

  <!-- pannello impostazioni: nascosto di default (display:none nel CSS), il JS lo mostra/nasconde -->
  <div id="settings-panel">
    <div id="settings-header">
      <span>Sveglie</span>
      <button id="settings-close" aria-label="Chiudi">✕</button>
    </div>

    <!-- qui dentro il JS crea/aggiorna dinamicamente una riga per ogni sveglia salvata -->
    <div id="alarms-list"></div>

    <button id="add-alarm">+ Aggiungi sveglia</button>

    <!-- tracce scelte dalla memoria del telefono: il JS riempie la lista e usa il campo file nascosto -->
    <div id="tracks-title">Suonerie</div>
    <div id="tracks-list"></div>
    <button id="add-tracks">+ Scegli tracce dal telefono</button>
    <input type="file" id="tracks-input" accept="audio/*" multiple style="display:none">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
