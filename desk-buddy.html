<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Buddy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #E9E1F2;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    user-select: none;
  }

  body {
    /* sfondo morbido a due toni, niente immagini esterne */
    background: -webkit-linear-gradient(top, #F3E9F5 0%, #E3D6EE 55%, #D9CBEA 100%);
    background: linear-gradient(to bottom, #F3E9F5 0%, #E3D6EE 55%, #D9CBEA 100%);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    position: relative;
  }

  #app {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }

  /* Orologio: pillola morbida in alto */
  #clock {
    position: absolute;
    top: 7%;
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 1px;
    color: #6B5279;
    background: rgba(255,255,255,0.55);
    padding: 8px 20px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  #buddy-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }

  #buddy {
    position: absolute;
    top: 0; left: 0;
    width: 220px;
    height: 220px;
    border-radius: 46% 54% 55% 45% / 55% 48% 52% 45%;
    background: -webkit-radial-gradient(35% 30%, circle, #FFD9E8 0%, #F6A9C9 60%, #EE8FBC 100%);
    background: radial-gradient(circle at 35% 30%, #FFD9E8 0%, #F6A9C9 60%, #EE8FBC 100%);
    box-shadow: 0 18px 40px rgba(150, 90, 140, 0.28);
    -webkit-animation: breathe 3.2s ease-in-out infinite;
    animation: breathe 3.2s ease-in-out infinite;
  }

  #face {
    position: absolute;
    top: 50%; left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    font-size: 46px;
    color: #5B3E56;
    white-space: nowrap;
  }

  .cheek {
    position: absolute;
    width: 26px;
    height: 16px;
    border-radius: 50%;
    background: #FF87AE;
    opacity: 0;
    -webkit-transition: opacity .35s ease;
    transition: opacity .35s ease;
  }
  .cheek-left  { left: 34px;  top: 128px; }
  .cheek-right { right: 34px; top: 128px; }

  /* Stati */
  .state-happy .cheek { opacity: 0.55; }

  .state-dizzy #buddy {
    -webkit-animation: wobble .35s ease-in-out 3, breathe 3.2s ease-in-out infinite;
    animation: wobble .35s ease-in-out 3, breathe 3.2s ease-in-out infinite;
  }

  .state-sleepy #buddy {
    background: -webkit-radial-gradient(35% 30%, circle, #E4D3EC 0%, #C9AEDB 60%, #B79BD1 100%);
    background: radial-gradient(circle at 35% 30%, #E4D3EC 0%, #C9AEDB 60%, #B79BD1 100%);
    -webkit-animation: breathe-slow 4.5s ease-in-out infinite;
    animation: breathe-slow 4.5s ease-in-out infinite;
  }

  @-webkit-keyframes breathe {
    0%, 100% { -webkit-transform: scale(1); }
    50%      { -webkit-transform: scale(1.035); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }

  @-webkit-keyframes breathe-slow {
    0%, 100% { -webkit-transform: scale(1); }
    50%      { -webkit-transform: scale(1.02); }
  }
  @keyframes breathe-slow {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.02); }
  }

  @-webkit-keyframes wobble {
    0%   { -webkit-transform: rotate(0deg); }
    25%  { -webkit-transform: rotate(-7deg); }
    75%  { -webkit-transform: rotate(7deg); }
    100% { -webkit-transform: rotate(0deg); }
  }
  @keyframes wobble {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-7deg); }
    75%  { transform: rotate(7deg); }
    100% { transform: rotate(0deg); }
  }

  /* Cuoricini che salgono quando viene accarezzato */
  #hearts {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .heart {
    position: absolute;
    top: 55%;
    font-size: 20px;
    color: #FF6FA0;
    opacity: 0.9;
    -webkit-animation: float-up 1.5s ease-out forwards;
    animation: float-up 1.5s ease-out forwards;
  }
  @-webkit-keyframes float-up {
    0%   { -webkit-transform: translateY(0) scale(0.6); opacity: 0; }
    15%  { opacity: 1; }
    100% { -webkit-transform: translateY(-140px) scale(1.1); opacity: 0; }
  }
  @keyframes float-up {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translateY(-140px) scale(1.1); opacity: 0; }
  }

  #enable-motion {
    display: none;
    position: absolute;
    bottom: 8%;
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    color: #6B5279;
    background: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>

<div id="app">
  <div id="clock">--:--</div>

  <div id="buddy-wrap" class="state-idle">
    <div id="buddy">
      <div id="face">•‿•</div>
      <div class="cheek cheek-left"></div>
      <div class="cheek cheek-right"></div>
    </div>
  </div>

  <div id="hearts"></div>

  <button id="enable-motion">Attiva sensori di movimento</button>
</div>

<script>
(function () {
  "use strict";

  var wrap  = document.getElementById('buddy-wrap');
  var face  = document.getElementById('face');
  var clockEl = document.getElementById('clock');
  var heartsContainer = document.getElementById('hearts');
  var motionBtn = document.getElementById('enable-motion');

  var FACES = {
    idle:   '•‿•',
    happy:  '♡‿♡',
    dizzy:  '@‿@',
    sleepy: '-‿-'
  };

  var baseline = 'idle';   // stato di fondo: 'idle' oppure 'sleepy' (deciso dall'orologio)
  var reacting = false;    // true mentre e' attiva una reazione temporanea (carezza/scossa)
  var reactTimer = null;

  function applyState(state) {
    wrap.className = 'state-' + state;
    face.textContent = FACES[state] || FACES.idle;
  }

  function reactTemporarily(state, durationMs) {
    reacting = true;
    applyState(state);
    if (reactTimer) { clearTimeout(reactTimer); }
    reactTimer = setTimeout(function () {
      reacting = false;
      applyState(baseline);
    }, durationMs);
  }

  // ---------- Orologio ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function updateClock() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    clockEl.textContent = pad(h) + ':' + pad(m);

    var newBaseline = (h >= 23 || h < 7) ? 'sleepy' : 'idle';
    if (newBaseline !== baseline) {
      baseline = newBaseline;
      if (!reacting) { applyState(baseline); }
    }
  }
  updateClock();
  setInterval(updateClock, 1000 * 15); // basta ogni 15s, risparmia batteria

  // ---------- Carezza (tocco) ----------
  function spawnHeart() {
    var heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = '♡';
    heart.style.left = (38 + Math.random() * 24) + '%';
    heartsContainer.appendChild(heart);
    setTimeout(function () {
      if (heart.parentNode) { heart.parentNode.removeChild(heart); }
    }, 1600);
  }

  var lastHeartTime = 0;
  function handlePet() {
    reactTemporarily('happy', 1500);
    var now = Date.now();
    if (now - lastHeartTime > 220) { // non spammare cuoricini ad ogni pixel di movimento
      lastHeartTime = now;
      spawnHeart();
    }
  }

  wrap.addEventListener('touchstart', handlePet, { passive: true });
  wrap.addEventListener('touchmove', function (e) {
    handlePet();
    e.preventDefault();
  }, { passive: false });
  wrap.addEventListener('mousedown', handlePet); // comodo per provarlo da desktop

  // ---------- Scossa (accelerometro) ----------
  var lastX = null, lastY = null, lastZ = null, lastShakeTime = 0;

  function handleMotion(e) {
    var acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc || acc.x === null) { return; }

    var x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;

    if (lastX !== null) {
      var delta = Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);
      var now = Date.now();
      if (delta > 25 && now - lastShakeTime > 1500) {
        lastShakeTime = now;
        reactTemporarily('dizzy', 1800);
      }
    }
    lastX = x; lastY = y; lastZ = z;
  }

  function setupMotion() {
    if (typeof DeviceMotionEvent === 'undefined') { return; } // sensore non disponibile

    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+: il permesso va chiesto con un tap esplicito dell'utente
      motionBtn.style.display = 'block';
      motionBtn.addEventListener('click', function () {
        DeviceMotionEvent.requestPermission().then(function (response) {
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            motionBtn.style.display = 'none';
          }
        }).catch(function () { /* sensore non concesso, il buddy funziona lo stesso */ });
      });
    } else {
      // Android e iOS piu' vecchi: nessun permesso da chiedere
      window.addEventListener('devicemotion', handleMotion);
    }
  }
  setupMotion();

  // stato iniziale
  applyState(baseline);

})();
</script>
</body>
</html>
